<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>حزازير وألغاز</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1033">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #170F2E;
    --bg-2: #221A44;
    --panel: #251C4A;
    --amber: #E8A93B;
    --amber-soft: #F3C876;
    --cream: #F4EFE6;
    --easy: #4C9A6A;
    --medium: #D08A2A;
    --hard: #C0473F;
    --text-dim: #B6ACD6;
    --radius: 18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Tajawal', sans-serif;
    background:
      radial-gradient(circle at 15% 8%, rgba(232,169,59,0.10), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(126,92,214,0.14), transparent 48%),
      var(--bg);
    color: var(--cream);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow-x:hidden;
  }
  #app{ width:100%; max-width:480px; position:relative; }
  .screen{ animation: fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .screen{animation:none;} }

  .motif{ position:absolute; width:46px; height:46px; border: 2px solid var(--amber); opacity:0.5; }
  .motif::before{ content:""; position:absolute; inset:6px; border:1px solid var(--amber); transform:rotate(45deg); }
  .motif.tl{ top:-10px; right:-10px; border-width:0 2px 2px 0; border-radius: 0 0 0 24px;}
  .motif.br{ bottom:-10px; left:-10px; border-width:2px 0 0 2px; border-radius: 24px 0 0 0;}

  .card{
    background: var(--panel);
    border:1px solid rgba(232,169,59,0.22);
    border-radius: var(--radius);
    padding:28px 22px;
    position:relative;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.65);
  }

  h1.title{
    font-family:'Cairo', sans-serif;
    font-weight:900;
    font-size:1.9rem;
    text-align:center;
    color: var(--amber-soft);
    margin-bottom:4px;
  }
  .subtitle{ text-align:center; color: var(--text-dim); font-size:0.92rem; margin-bottom:26px; }
  .rule{ height:1px; background: linear-gradient(90deg, transparent, var(--amber), transparent); opacity:0.5; margin: 18px 0; }

  .diff-list{ display:flex; flex-direction:column; gap:12px; }
  .diff-btn{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px; border-radius:14px; border:1px solid rgba(255,255,255,0.08);
    cursor:pointer; font-family:'Cairo', sans-serif; font-weight:700; color:var(--cream);
    background: var(--bg-2); transition: transform .15s ease, filter .15s ease;
  }
  .diff-btn:hover, .diff-btn:focus-visible{ transform: translateY(-2px); filter:brightness(1.12); outline:none;}
  .diff-btn .dot{ width:12px; height:12px; border-radius:50%; }
  .diff-btn.easy .dot{ background:var(--easy);} 
  .diff-btn.medium .dot{ background:var(--medium);} 
  .diff-btn.hard .dot{ background:var(--hard);} 
  .diff-btn .meta{ font-family:'Tajawal',sans-serif; font-weight:400; font-size:0.8rem; color:var(--text-dim);}

  .back-link{
    display:inline-flex; align-items:center; gap:6px; color: var(--text-dim);
    font-size:0.85rem; cursor:pointer; margin-bottom:18px; background:none; border:none; font-family:'Tajawal',sans-serif;
  }
  .back-link:hover{ color: var(--amber-soft); }

  .sound-toggle{
    position:absolute; top:16px; left:16px;
    width:38px; height:38px;
    border-radius:50%;
    border:1px solid rgba(232,169,59,0.3);
    background: var(--bg-2);
    font-size:1.1rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease, background .15s ease;
    z-index:2;
  }
  .sound-toggle:hover{ transform:scale(1.06); background:#2A2154; }

  .quiz-top{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
    font-family:'Cairo', sans-serif; font-size:0.85rem; color: var(--text-dim);
  }
  .score-pill{
    background: rgba(232,169,59,0.12); border:1px solid rgba(232,169,59,0.35);
    color: var(--amber-soft); padding:4px 12px; border-radius:999px; font-weight:700;
  }
  .progress-bar{ height:6px; background: rgba(255,255,255,0.08); border-radius:99px; overflow:hidden; margin-bottom:22px; }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--amber), var(--amber-soft)); transition: width .3s ease; }

  .riddle-box{
    background: var(--bg-2);
    border: 1px solid rgba(232,169,59,0.18);
    border-radius: 14px;
    padding:18px;
    margin-bottom:16px;
  }
  .riddle-icon{ font-size:1.4rem; margin-bottom:8px; display:block; }
  .q-text{
    font-family:'Cairo', sans-serif; font-weight:700; font-size:1.1rem; line-height:1.8;
  }
  .hint-row{ display:flex; justify-content:flex-end; margin-bottom:16px; }
  .hint-btn{
    background:none; border:1px solid rgba(232,169,59,0.4); color: var(--amber-soft);
    padding:7px 14px; border-radius:999px; font-family:'Tajawal',sans-serif; font-size:0.82rem; cursor:pointer;
    transition: background .15s ease;
  }
  .hint-btn:hover{ background: rgba(232,169,59,0.1); }
  .hint-btn:disabled{ opacity:0.4; cursor:default; }
  .hint-text{
    font-size:0.85rem; color: var(--amber-soft); background: rgba(232,169,59,0.08);
    border-radius:10px; padding:10px 12px; margin-bottom:16px; display:none; line-height:1.7;
  }
  .hint-text.show{ display:block; animation: fadeIn .25s ease; }

  .options{ display:flex; flex-direction:column; gap:11px; }
  .opt-btn{
    text-align:right; padding:14px 16px; border-radius:12px; border:1px solid rgba(255,255,255,0.1);
    background: var(--bg-2); color: var(--cream); font-family:'Tajawal', sans-serif; font-size:0.98rem;
    cursor:pointer; transition: all .15s ease;
  }
  .opt-btn:hover:not(:disabled){ border-color: var(--amber); background:#2A2154; }
  .opt-btn:focus-visible{ outline: 2px solid var(--amber); outline-offset:2px; }
  .opt-btn:disabled{ cursor:default; }
  .opt-btn.correct{ background: rgba(76,154,106,0.25); border-color: var(--easy); color:#CDEBD8; }
  .opt-btn.wrong{ background: rgba(192,71,63,0.25); border-color: var(--hard); color:#F0CFC7; }

  .next-hint{ text-align:center; color: var(--text-dim); font-size:0.8rem; margin-top:16px; min-height:18px; }

  .result-emoji{ text-align:center; font-size:3rem; margin-bottom:6px; }
  .result-score{
    text-align:center; font-family:'Cairo', sans-serif; font-weight:900; font-size:2.4rem;
    color: var(--amber-soft); margin-bottom:4px;
  }
  .result-label{ text-align:center; color: var(--text-dim); margin-bottom:6px; font-size:0.95rem; }
  .result-best{ text-align:center; color: var(--amber); font-size:0.85rem; margin-bottom:22px; }
  .btn-row{ display:flex; gap:10px; }
  .btn{
    flex:1; padding:13px; border-radius:12px; border:none; font-family:'Cairo', sans-serif;
    font-weight:700; cursor:pointer; font-size:0.92rem; transition: filter .15s ease, transform .15s ease;

/* ---------------- Sound engine (Web Audio API, no external files) ---------------- */
const SoundFX = (function(){
  let ctx = null;
  let muted = false;

  function ensureCtx(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) ctx = new AC();
    }
    if(ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function tone(freq, duration, type, startTime, gainPeak){
    const c = ensureCtx();
    if(!c || muted) return;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, c.currentTime + startTime);
    gain.gain.setValueAtTime(0, c.currentTime + startTime);
    gain.gain.linearRampToValueAtTime(gainPeak, c.currentTime + startTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + startTime + duration);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(c.currentTime + startTime);
    osc.stop(c.currentTime + startTime + duration + 0.02);
  }

  return {
    click(){ tone(520, 0.08, "sine", 0, 0.12); },
    correct(){
      tone(523.25, 0.14, "sine", 0, 0.18);
      tone(659.25, 0.14, "sine", 0.10, 0.18);
      tone(783.99, 0.22, "sine", 0.20, 0.20);
    },
    wrong(){
      tone(220, 0.18, "sawtooth", 0, 0.12);
      tone(174.61, 0.28, "sawtooth", 0.12, 0.12);
    },
    hint(){
      tone(880, 0.10, "triangle", 0, 0.10);
      tone(1046.5, 0.12, "triangle", 0.08, 0.10);
    },
    win(){
      [523.25,659.25,783.99,1046.5].forEach((f,i)=> tone(f, 0.22, "sine", i*0.12, 0.18));
    },
    isMuted(){ return muted; },
    setMuted(v){ muted = v; },
    toggle(){ muted = !muted; return muted; }
  };
})();

async function loadMutePref(){
  try{
    const res = await window.storage.get("riddle-muted", false);
    if(res && res.value === "1") SoundFX.setMuted(true);
  }catch(e){}
}
async function saveMutePref(v){
  try{ await window.storage.set("riddle-muted", v ? "1" : "0", false); }catch(e){}
}
loadMutePref();

/* ---------------- State ---------------- */
let state = {
  screen: "home",
  difficulty: null,
  qIndex: 0,
  score: 0,
  questions: [],
  answered: false,
  hintUsed: false,
};

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

async function getBest(diffKey){
  try{
    const res = await window.storage.get(`riddle-best:${diffKey}`, false);
    return res ? parseInt(res.value) : 0;
  }catch(e){ return 0; }
}
async function setBest(diffKey, score){
  try{ await window.storage.set(`riddle-best:${diffKey}`, String(score), false); }catch(e){}
}

/* ---------------- Rendering ---------------- */
const app = document.getElementById("app");

function render(){
  if(state.screen === "home") renderHome();
  else if(state.screen === "quiz") renderQuiz();
  else if(state.screen === "result") renderResult();
}

function renderHome(){
  app.innerHTML = `
    <div class="screen card">
      <div class="motif tl"></div><div class="motif br"></div>
      <button class="sound-toggle" id="soundToggle" aria-label="تشغيل/كتم الصوت">${SoundFX.isMuted() ? "🔇" : "🔊"}</button>
      <h1 class="title">🔮 حزازير وألغاز</h1>
      <p class="subtitle">اختبر ذكاءك وقدرتك على التفكير المنطقي</p>
      <div class="diff-list" id="diffList"></div>
    </div>
  `;
  document.getElementById("soundToggle").onclick = ()=>{
    const nowMuted = SoundFX.toggle();
    saveMutePref(nowMuted);
    document.getElementById("soundToggle").textContent = nowMuted ? "🔇" : "🔊";
    if(!nowMuted) SoundFX.click();
  };
  const list = document.getElementById("diffList");
  DIFFICULTIES.forEach(d=>{
    const btn = document.createElement("button");
    btn.className = `diff-btn ${d.cls}`;
    btn.innerHTML = `<span style="display:flex;align-items:center;gap:10px;"><span class="dot"></span>${d.icon} ${d.name}</span><span class="meta">${d.meta}</span>`;
    btn.onclick = ()=> { SoundFX.click(); startQuiz(d.key); };
    list.appendChild(btn);
  });
}

function startQuiz(diffKey){
  const bank = RIDDLES[diffKey];
  state.difficulty = diffKey;
  state.questions = shuffle(bank);
  state.qIndex = 0;
  state.score = 0;
  state.answered = false;
  state.hintUsed = false;
  state.screen = "quiz";
  render();
}

function renderQuiz(){
  const diffInfo = DIFFICULTIES.find(d=>d.key===state.difficulty);
  const total = state.questions.length;
  const q = state.questions[state.qIndex];
  const progressPct = Math.round((state.qIndex/total)*100);
  state.hintUsed = false;

  app.innerHTML = `
    <div class="screen card">
      <div class="motif tl"></div><div class="motif br"></div>
      <div class="quiz-top">
        <span>${diffInfo.icon} ${diffInfo.name}</span>
        <span style="display:flex; align-items:center; gap:8px;">
          <button id="soundToggleQuiz" style="background:none;border:none;font-size:1.05rem;cursor:pointer;color:var(--text-dim);">${SoundFX.isMuted() ? "🔇" : "🔊"}</button>
          <span class="score-pill">النقاط: ${state.score}</span>
        </span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <div class="riddle-box">
        <span class="riddle-icon">🧩</span>
        <div class="q-text">${state.qIndex+1}. ${q.q}</div>
      </div>
      <div class="hint-text" id="hintText">💡 ${q.hint}</div>
      <div class="hint-row">
        <button class="hint-btn" id="hintBtn">إظهار تلميح (-1 نقطة)</button>
      </div>
      <div class="options" id="options"></div>
      <div class="next-hint" id="nextHint"></div>
    </div>
  `;

  document.getElementById("soundToggleQuiz").onclick = ()=>{
    const nowMuted = SoundFX.toggle();
    saveMutePref(nowMuted);
    document.getElementById("soundToggleQuiz").textContent = nowMuted ? "🔇" : "🔊";
  };

  document.getElementById("hintBtn").onclick = ()=>{
    SoundFX.hint();
    state.hintUsed = true;
    document.getElementById("hintText").classList.add("show");
    document.getElementById("hintBtn").disabled = true;
  };

  const optsEl = document.getElementById("options");
  const shuffledOrder = q.options.map((text,i)=>({text,i}));
  q._display = shuffledOrder;

  shuffledOrder.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = opt.text;
    btn.onclick = ()=> handleAnswer(opt.i, btn);
    optsEl.appendChild(btn);
  });

  state.answered = false;
}

function handleAnswer(chosenIndex, btnEl){
  if(state.answered) return;
  state.answered = true;
  const q = state.questions[state.qIndex];
  const buttons = document.querySelectorAll(".opt-btn");
  buttons.forEach(b=> b.disabled = true);
  document.getElementById("hintBtn").disabled = true;

  const displayOrder = q._display;
  displayOrder.forEach((opt, idx)=>{
    const btn = buttons[idx];
    if(opt.i === q.a) btn.classList.add("correct");
    else if(opt.i === chosenIndex) btn.classList.add("wrong");
  });

  const correct = chosenIndex === q.a;
  if(correct) state.score += state.hintUsed ? 0 : 1;
  if(correct) SoundFX.correct(); else SoundFX.wrong();

  const hint = document.getElementById("nextHint");
  hint.textContent = correct
    ? (state.hintUsed ? "إجابة صحيحة (بدون نقاط بسبب التلميح) ✅" : "إجابة صحيحة! 🎉")
    : "إجابة خاطئة";

  setTimeout(()=>{
    if(state.qIndex < state.questions.length - 1){
      state.qIndex += 1;
      render();
    } else {
      finishQuiz();
    }
  }, 1300);
}

async function finishQuiz(){
  const best = await getBest(state.difficulty);
  if(state.score > best) await setBest(state.difficulty, state.score);
  state.screen = "result";
  render();
}

async function renderResult(){
  const total = state.questions.length;
  const pct = Math.round((state.score/total)*100);
  const diffInfo = DIFFICULTIES.find(d=>d.key===state.difficulty);
  const best = await getBest(state.difficulty);

  let emoji = "🙂";
  let label = "محاولة جيدة";
  if(pct === 100){ emoji="🏆"; label="عبقري! حللت كل الألغاز"; SoundFX.win(); }
  else if(pct >= 70){ emoji="🌟"; label="ذكاء رائع"; }
  else if(pct >= 40){ emoji="👍"; label="لا بأس، حاول مجدداً"; }
  else { emoji="💪"; label="حاول مرة أخرى، عقلك أقوى من كذا"; }

  app.innerHTML = `
    <div class="screen card">
      <div class="motif tl"></div><div class="motif br"></div>
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${state.score} / ${total}</div>
      <div class="result-label">${label} — ${diffInfo.icon} ${diffInfo.name}</div>
      <div class="result-best">أفضل نتيجة لهذا المستوى: ${best} / ${total}</div>
      <div class="rule"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="retryBtn">إعادة المحاولة</button>
        <button class="btn btn-secondary" id="homeBtn">المستويات</button>
      </div>
    </div>
  `;
  document.getElementById("retryBtn").onclick = ()=> { SoundFX.click(); startQuiz(state.difficulty); };
  document.getElementById("homeBtn").onclick = ()=>{ SoundFX.click(); state.screen="home"; render(); };
}

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
